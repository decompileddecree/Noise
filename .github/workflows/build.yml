name: Build

on:
  push:
  pull_request:

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsdl2-dev
      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2
      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install sdl2:x64-windows
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Configure (Linux and macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Bundle SDL2 runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/SDL2.dll" build/Release/
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: noise-windows
          path: |
            build/Release/noise.exe
            build/Release/SDL2.dll
      - name: Upload Unix executable
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: noise-${{ runner.os }}
          path: build/noise

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build debug APK
        run: bash android/gradlew --no-daemon --project-dir android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: noise-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
